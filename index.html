<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新加坡智慧养老交互演示</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #17222d;
        background: #f4f7f6;
        display: grid;
        place-items: center;
      }
      main { width: min(1060px, calc(100% - 40px)); padding: 72px 0; }
      .eyebrow { color: #178267; font-weight: 700; letter-spacing: .08em; }
      h1 { margin: 12px 0; font-size: clamp(32px, 5vw, 56px); letter-spacing: -.04em; }
      .intro { margin: 0 0 38px; color: #61707c; font-size: 18px; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
      a {
        min-height: 210px;
        padding: 28px;
        color: inherit;
        text-decoration: none;
        border: 1px solid #dfe7e4;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 12px 32px rgba(28, 60, 51, .07);
        transition: transform .2s ease, box-shadow .2s ease;
      }
      a:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(28, 60, 51, .12); }
      .number { color: #178267; font-size: 14px; font-weight: 800; }
      h2 { margin: 48px 0 8px; font-size: 24px; }
      p { margin: 0; color: #6c7983; line-height: 1.65; }
      @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } a { min-height: 170px; } h2 { margin-top: 28px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">INTERACTIVE PROTOTYPE</div>
      <h1>新加坡智慧养老</h1>
      <p class="intro">请选择终端进入交互界面。</p>
      <div class="grid">
        <a href="./admin/">
          <span class="number">01</span>
          <h2>管理后台</h2>
          <p>机构、老人、设备、服务与运营管理界面。</p>
        </a>
        <a href="./elder-screen/">
          <span class="number">02</span>
          <h2>老人端中控屏</h2>
          <p>面向长者的居家照护与社区服务交互界面。</p>
        </a>
        <a href="./family-mobile/">
          <span class="number">03</span>
          <h2>子女手机端</h2>
          <p>面向家庭成员的长辈关怀与健康查看界面。</p>
        </a>
      </div>
    </main>
  </body>
</html>
